; dinput8_merge.ini - settings for the wheel + pedals merge proxy.
; Put this file next to dinput8.dll (the game folder). Comments must be on their own line.

[General]
; 1 = merge devices, 0 = pass everything straight through (proxy does nothing)
Enabled=1
; 1 = write dinput8_merge.log next to the dll
Log=0
; 1 = also log, once per second while a pedal moves, the range each pedal axis moved through
; and what the game was given (use this to find the right mapping)
Debug=1
; 1 = if every mapped pedal axis reads exactly mid-scale (pedals that send nothing until
; first moved), treat the pedals as released instead of half-pressed
IgnoreCenterUntilMoved=1

[Devices]
; A device is picked when its product name CONTAINS this text (case-insensitive).
; From your log, the wheel shows up as "Thrustmaster Advanced Mode Racer".
WheelMatch=Advanced Mode Racer
PedalsMatch=Fanatec

[Spoof]
; 0 = game sees the wheel under its real name (it uses its default wheel profile)
; 1 = game sees the wheel as the vendor/product below (to pick a built-in profile)
; 044F:B66E is the T300RS in PC mode (name: Thrustmaster T300RS Racing Wheel).
Enabled=1
VendorId=0x044F
ProductId=0xB66E
ProductName=Thrustmaster T300RS Racing Wheel

[Map]
; MapN=PedalAxis,GameAxis,Invert
; PedalAxis = which axis of the PEDAL device to read.
; GameAxis  = which axis slot of the WHEEL device it replaces in what the game reads.
; Axis names: X, Y, Z, Rx, Ry, Rz, Slider0, Slider1.   Invert: 0 or 1.
;
; GameAxis values match the T300RS layout in the game's data
; (throttle = Rz, brake = Y, clutch = Slider0).
; Invert=1 because the T300RS profile expects a released pedal at the high end of the axis,
; while your Fanatec pedals read 0 when released.
;
; PedalAxis values confirmed from the log: X = throttle, Y = brake, Z = clutch.
Map1=X,Rz,1
Map2=Y,Y,1
Map3=Z,Slider0,1

[Buttons]
; Virtual buttons. The game's pause action is bound to "button 7" (and ESC), but that button
; may not exist on your wheel. These lines make the game SEE a button as pressed:
;   ButtonN=Key:NAME,GameButton            a keyboard key (ESC, ENTER, SPACE, TAB, P, F1..F12 ...)
;   ButtonN=Wheel:N,GameButton[,Move]      another wheel button; Move=1 stops the original
;                                          button also doing its normal job
; Keys only work while the game window is in front.
; With Debug=1 the log prints "wheel button N DOWN" for every wheel button you press, so you
; can find the number of a button the game doesn't use in a race. Unused in the race profile:
; 5, 6, 10, 11 and up. Used: 0,1,2,3,4,7,8,9 and the D-pad.
Button1=Key:ESC,7
; Example for a wheel button that logs as 6:
; Button2=Wheel:6,7

